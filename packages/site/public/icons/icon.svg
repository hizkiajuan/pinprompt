<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="pp-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1D1C1B"/><stop offset="1" stop-color="#0A0A0A"/></linearGradient>
    <linearGradient id="pp-accent" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="90" y2="100"><stop offset="0" stop-color="#FF7AD0"/><stop offset="1" stop-color="#C21D86"/></linearGradient>
    <linearGradient id="pp-paper" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="90" y2="100"><stop offset="0" stop-color="#F6F2EB"/><stop offset="1" stop-color="#D9D2C6"/></linearGradient>
