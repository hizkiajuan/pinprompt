<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tallybook</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: #f7f6f4;
        color: #1c1917;
        font-size: 14px;
        line-height: 1.4;
      }
      .layout {
        display: grid;
        grid-template-columns: 220px 1fr;
        min-height: 100vh;
      }
      aside {
        background: #fff;
        border-right: 1px solid #e7e5e4;
        padding: 22px 18px;
      }
      aside b {
        font-size: 17px;
      }
      aside nav {
        margin-top: 28px;
        display: grid;
        gap: 4px;
      }
      aside nav span {
        padding: 8px 10px;
        border-radius: 8px;
        color: #57534e;
      }
      aside nav .on {
        background: #f5f5f4;
        color: #1c1917;
        font-weight: 500;
      }
      main {
        padding: 24px 32px;
      }
      h1 {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin-top: 2px;
      }
      .muted {
        color: #78716c;
        font-size: 13px;
      }
      .grid {
        margin-top: 20px;
        display: grid;
        grid-template-columns: 400px 1fr;
        gap: 24px;
        max-width: 1000px;
      }
      .card {
        background: #fff;
        border: 1px solid #e7e5e4;
        border-radius: 12px;
        padding: 20px 24px;
      }
      .card h3 {
        font-size: 15px;
        font-weight: 600;
      }
      .card .muted {
        margin-top: 4px;
      }
      .invoices {
        grid-column: 1 / -1;
      }
      .price {
        margin-top: 22px;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .price span {
        font-size: 14px;
        color: #78716c;
        font-weight: 400;
      }
      .actions {
        margin-top: 18px;
        display: flex;
        gap: 12px;
      }
      .button {
        font: inherit;
        font-weight: 500;
        height: 36px;
        padding: 0 16px;
        border-radius: 8px;
        border: 1px solid #e7e5e4;
        background: #f5f5f4;
        color: #1c1917;
        cursor: pointer;
      }
      .button.ghost {
        background: none;
        border-color: transparent;
        color: #57534e;
      }
      .chart {
        margin-top: 16px;
        height: 110px;
        display: flex;
        align-items: flex-end;
        gap: 10px;
      }
      .chart i {
        flex: 1;
        background: #e7e5e4;
        border-radius: 4px 4px 0 0;
      }
      .chart i.now {
        background: #1c1917;
      }
      table {
        margin-top: 14px;
        width: 100%;
        border-collapse: collapse;
      }
      th {
        text-align: left;
        color: #78716c;
        font-weight: 500;
        font-size: 12.5px;
        height: 36px;
        border-bottom: 1px solid #e7e5e4;
      }
      td {
        height: 48px;
        border-bottom: 1px solid #f0efed;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      .status {
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
        background: #ecfdf3;
        color: #15803d;
      }
      .status.due {
        background: #fef3c7;
        color: #b45309;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./app.tsx"></script>
  </body>
</html>
